[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/v7/*"
  to = "/.netlify/functions/api/v7/:splat"
  status = 200

[[redirects]]
  from = "/v8/*"
  to = "/.netlify/functions/api/v8/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

