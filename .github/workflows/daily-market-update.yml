name: Automated Daily Market Data Pipeline

on:
  schedule:
    # 10:15 UTC & backup 10:30 UTC = 3:45 PM / 4:00 PM IST (Mon - Fri) -> Stage 1: Market EOD Closes
    - cron: '15 10 * * 1-5'
    - cron: '30 10 * * 1-5'
    # 13:30 UTC & backup 13:50 UTC = 7:00 PM / 7:20 PM IST (Mon - Fri) -> Stage 2: FII / DII & Sector Turnover
    - cron: '30 13 * * 1-5'
    - cron: '50 13 * * 1-5'
    # 15:00 UTC = 8:30 PM IST (Mon - Fri) -> Stage 2 Verification Pass: Finalized Exchange Settlements
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update Batch to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - eod
          - fii

permissions:
  contents: write

concurrency:
  group: daily-market-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Pipeline Mode
        id: select-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "15 10 * * 1-5" ] || [ "${{ github.event.schedule }}" = "30 10 * * 1-5" ]; then
            echo "MODE=eod" >> $GITHUB_ENV
          else
            echo "MODE=fii" >> $GITHUB_ENV
          fi

      - name: Execute Daily Market Pipeline (Real Exchange Feeds)
        run: |
          echo "Executing pipeline with mode: $MODE"
          node scripts/daily_market_pipeline.js --mode=$MODE

      - name: Sync Nifty 500 Screener Universe (at 3:45 PM / All)
        if: env.MODE == 'eod' || env.MODE == 'all'
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          node scripts/build-nifty500-universe.js || true
          kill $SERVER_PID || true

      - name: Commit and Push Updated Market Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): automated daily market update [$MODE] [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
            echo "Pushed updated market data to main."
          fi

      - name: Trigger Render Production Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render webhook deploy..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK_URL" || true
            echo "Render deploy triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping Render webhook."
          fi
