name: Update Daily Market Intelligence (FII/DII & Nifty 500)

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST (Mon-Fri) - Market closes at 3:30 PM IST, NSE publishes after market close
    - cron: '30 13 * * 1-5'
    # 15:00 UTC = 8:30 PM IST (Mon-Fri) - Secondary pass for finalized exchange settlements
    - cron: '0 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest FII / DII Data from Groww
        run: node scripts/fetch-fii-dii.js

      - name: Sync Sector Turnover from ScreeningMantis
        run: node scripts/update-sector-turnover.js

      - name: Start Market Proxy & Sync Nifty 500 Universe
        run: |
          node server.js &
          sleep 3
          node scripts/build-nifty500-universe.js

      - name: Commit and Push if Updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(data): daily post-market market sync (FII/DII & Nifty 500) [skip ci]"
            git push
            echo "Successfully updated and pushed new market data."
          else
            echo "No new market data released yet."
          fi
